<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO & Social -->
    <meta name="description" content="Portfolio of PARTH MAVANI — Information Technology student and aspiring full-stack developer. React, Node.js, MongoDB." />
    <meta name="keywords" content="Parth Mavani, portfolio, full-stack developer, React, Node.js" />
    <meta name="author" content="PARTH MAVANI" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#10b981" />

    <!-- Open Graph -->
    <meta property="og:title" content="PARTH MAVANI — Student Portfolio" />
    <meta property="og:description" content="Information Technology student and aspiring full-stack developer." />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect to Google Fonts (eliminates render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS prefetch for external APIs -->
    <link rel="dns-prefetch" href="//api.github.com" />

    <!-- Preload font CSS (non-blocking) -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" />
    </noscript>

    <title>PARTH MAVANI — Student Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
